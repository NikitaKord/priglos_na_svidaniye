<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Свидание</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="index">
    <div class="page-shell">
      <div class="decor decor-left">❤</div>
      <div class="decor decor-right">💘</div>

      <main class="card">
        <p class="eyebrow">Для тебя, моя звезда</p>
        <h1>Привет, красотка</h1>
        <p class="subtitle">Скажи, как тебя зовут?</p>

        <form id="nameForm" class="name-form">
          <label class="field-label" for="nameInput">Имя</label>
          <input id="nameInput" name="name" type="text" maxlength="30" autocomplete="off" />
          <p id="errorMessage" class="error-message" aria-live="polite"></p>
          <button type="submit" class="primary-btn">Продолжить</button>
        </form>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Выбери место</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="place">
    <div class="page-shell">
      <div class="decor decor-left">💖</div>
      <div class="decor decor-right">🩷</div>

      <main class="card wide-card">
        <p class="eyebrow">Выбираем идеальное место</p>
        <h1>Где мы проведем время?</h1>

        <div class="place-grid">
          <button type="button" class="place-card" data-place="Кино ( Cínema Michèle )">
            <img src="cino.jpg" alt="Кино" />
            <span>Кино ( Cínema Michèle )</span>
          </button>

          <button type="button" class="place-card" data-place="Ресторан ( II Lado dei Cigni )">
            <img src="rest.jpg" alt="Ресторан" />
            <span>Ресторан ( II Lado dei Cigni )</span>
          </button>

          <button type="button" class="place-card" data-place="Бильярд ( Бар разбитых сердец )">
            <img src="bil.jpg" alt="Бильярд" />
            <span>Бильярд ( Бар разбитых сердец )</span>
          </button>

          <button type="button" class="place-card" data-place="Музей ( МАФ )">
            <img src="mus.jpg" alt="Музей" />
            <span>Музей ( МАФ )</span>
          </button>

          <button type="button" class="place-card" data-place="Мастер-класс ( Pause )">
            <img src="master.jpg" alt="Мастер-класс" />
            <span>Мастер-класс ( Pause )</span>
          </button>

          <button type="button" class="place-card" data-place="Прогулка">
            <img src="progul.jpg" alt="Прогулка" />
            <span>Прогулка</span>
          </button>

          <div class="place-card custom-card" data-place="Свой вариант">
            <div class="custom-placeholder">?</div>
            <span>Свой вариант</span>
            <input type="text" class="custom-place-input" maxlength="40" placeholder="Напиши свой вариант" aria-label="Свой вариант" />
            <button type="button" class="custom-place-btn">Готово</button>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
